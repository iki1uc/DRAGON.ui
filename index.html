<script>
(() => {
  const audio = new Audio("./autumn_nature_soundscape.mp3");
  audio.loop = true;
  audio.volume = 0.16;
  const ui = document.createElement("div");
  ui.id = "natur-sound-ui";
  ui.style.cssText = `
    position:fixed;right:16px;bottom:88px;z-index:99999;
    display:flex;align-items:center;gap:8px;padding:9px 10px;
    color:#e8f0e8;background:rgba(2,6,10,.88);
    border:1px solid rgba(0,204,255,.35);border-radius:12px;
    backdrop-filter:blur(16px);font:11px ui-monospace,monospace;
    box-shadow:0 0 20px rgba(0,204,255,.15);
  `;
  const play = document.createElement("button");
  const upload = document.createElement("button");
  const volume = document.createElement("input");
  const remove = document.createElement("button");
  const file = document.createElement("input");
  play.textContent = "▶ NATUR";
  upload.textContent = "AUDIO AUSWÄHLEN";
  remove.textContent = "✕";
  file.type = "file";
  file.accept = "audio/*";
  file.hidden = true;
  volume.type = "range";
  volume.min = "0";
  volume.max = "100";
  volume.value = "16";
  volume.style.width = "70px";
  volume.title = "Lautstärke";
  [play, upload, remove].forEach(button => {
    button.style.cssText = `
      padding:6px 8px;border:1px solid rgba(255,255,255,.16);
      border-radius:7px;background:rgba(255,255,255,.08);
      color:#fff;font:inherit;cursor:pointer;
    `;
  });
  play.onclick = async () => {
    try {
      if (audio.paused) {
        await audio.play();
        play.textContent = "■ PAUSE";
      } else {
        audio.pause();
        play.textContent = "▶ NATUR";
      }
    } catch(e){ console.log("audio play blocked", e); play.textContent = "▶ NATUR (click)"; }
  };
  upload.onclick = () => file.click();
  file.onchange = async () => {
    const selected = file.files[0];
    if (!selected) return;
    audio.pause();
    try { URL.revokeObjectURL(audio.src); } catch(e){}
    audio.src = URL.createObjectURL(selected);
    try { await audio.play(); play.textContent = "■ PAUSE"; } catch(e){}
    upload.textContent = "♫ " + selected.name.slice(0, 18);
  };
  volume.oninput = () => audio.volume = volume.value / 100;
  remove.onclick = () => {
    audio.pause();
    try { audio.src = ""; } catch(e){}
    play.textContent = "▶ NATUR";
    upload.textContent = "AUDIO AUSWÄHLEN";
    file.value = "";
  };
  // Auto-try to start after first user interaction anywhere (TikTok browser needs gesture)
  const tryAuto = () => {
    if (audio.paused && audio.src) {
      audio.play().then(()=>{ play.textContent="■ PAUSE"; }).catch(()=>{});
    }
    document.removeEventListener("click", tryAuto);
    document.removeEventListener("keydown", tryAuto);
  };
  document.addEventListener("click", tryAuto, {once:true});
  document.addEventListener("keydown", tryAuto, {once:true});
  ui.append(play, upload, volume, remove, file);
  document.body.appendChild(ui);
  window.__NUTZRAUM_NATUR_AUDIO__ = audio;
})();
</script>
